name: Build and deploy microservices

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push booking API image
        uses: docker/build-push-action@v6
        with:
          context: ./booking-api
          file: ./booking-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booking-api:latest

      - name: Build and push listing API image
        uses: docker/build-push-action@v6
        with:
          context: ./listing-api
          file: ./listing-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/listing-api:latest

      - name: Build and push search API image
        uses: docker/build-push-action@v6
        with:
          context: ./search-api
          file: ./search-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/search-api:latest

      - name: Restart Kubernetes deployments on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl rollout restart deployment booking-api-deployment
            kubectl rollout restart deployment listing-api-deployment
            kubectl rollout restart deployment searching-api-deployment
